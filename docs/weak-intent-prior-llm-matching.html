<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>弱意图智能体匹配流程</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f7f5;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    svg {
      width: min(100vw - 40px, 1700px);
      height: auto;
      display: block;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 46px rgba(15, 23, 42, .12);
    }

    text {
      fill: #111;
      dominant-baseline: middle;
    }

    .title { font-size: 42px; font-weight: 900; }
    .step { font-size: 27px; font-weight: 850; letter-spacing: 8px; }
    .card-title { font-size: 22px; font-weight: 900; }
    .card-sub { font-size: 15px; font-weight: 720; fill: #4b5563; }
    .small { font-size: 13px; font-weight: 740; fill: #4b5563; }
    .tiny { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
    .code-title { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 23px; font-weight: 850; }
    .label { font-size: 15px; font-weight: 900; fill: #fff; }
    .red { fill: #e00000; font-size: 23px; font-weight: 900; }
    .formula { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #374151; font-weight: 780; }
  </style>
</head>
<body>
<svg viewBox="0 0 1700 960" role="img" aria-label="基于先验偏好数据和LLM的弱意图智能体匹配流程">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#111827" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1700" height="960" fill="#fff"/>
  <text x="34" y="54" class="title">匹配最佳智能体</text>

  <!-- Step headers -->
  <rect x="22" y="98" width="812" height="72" rx="20" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="428" y="134" text-anchor="middle" class="step">STEP 1：基于先验偏好数据的召回排序</text>

  <rect x="866" y="98" width="812" height="72" rx="20" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="1272" y="134" text-anchor="middle" class="step">STEP 2：LLM 最终匹配 TOP3 中的最佳智能体</text>

  <!-- Left side: Step 1 -->
  <g filter="url(#shadow)">
    <rect x="58" y="220" width="190" height="104" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="153" y="248" text-anchor="middle" class="card-title">用户输入</text>
    <text x="153" y="278" text-anchor="middle" class="card-sub">query</text>
    <text x="153" y="304" text-anchor="middle" class="small">“我需要陪小孩”</text>

    <rect x="58" y="374" width="190" height="128" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="153" y="402" text-anchor="middle" class="card-title">场景归一</text>
    <text x="153" y="430" text-anchor="middle" class="card-sub">规则优先</text>
    <text x="153" y="454" text-anchor="middle" class="card-sub">低置信用小模型</text>
    <text x="153" y="482" text-anchor="middle" class="small">输出：休闲陪伴</text>

    <rect x="58" y="548" width="190" height="104" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="153" y="576" text-anchor="middle" class="card-title">用户画像</text>
    <text x="153" y="606" text-anchor="middle" class="card-sub">年龄段 / 性别</text>
    <text x="153" y="632" text-anchor="middle" class="small">职场成人 / 男</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="314" y="238" width="276" height="284" rx="22" fill="#fffaf0" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="452" y="272" text-anchor="middle" class="card-title">问卷偏好先验库</text>
    <text x="452" y="304" text-anchor="middle" class="card-sub">用户 × 场景 × 智能体类型</text>
    <line x1="344" y1="332" x2="560" y2="332" stroke="#fbbf24"/>
    <text x="452" y="362" text-anchor="middle" class="small">A：用户类型 × 场景 × 类型</text>
    <text x="452" y="394" text-anchor="middle" class="small">B：场景 × 智能体类型</text>
    <text x="452" y="426" text-anchor="middle" class="small">C：用户类型 × 智能体类型</text>
    <text x="452" y="458" text-anchor="middle" class="small">D：性别 × 智能体类型（弱权重）</text>
    <text x="452" y="492" text-anchor="middle" class="tiny">数据源：量表评分 1-7 分</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="628" y="226" width="184" height="90" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="720" y="254" text-anchor="middle" class="card-title">类型映射</text>
    <text x="720" y="284" text-anchor="middle" class="small">亲密陪伴型 → 虎子</text>

    <rect x="628" y="358" width="184" height="138" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="720" y="386" text-anchor="middle" class="card-title">偏好分计算</text>
    <text x="720" y="414" text-anchor="middle" class="formula">数据拟合：score ≈ A</text>
    <text x="720" y="440" text-anchor="middle" class="formula">A 权重约 1.00</text>
    <text x="720" y="468" text-anchor="middle" class="tiny">B/C/D 用于缺失兜底</text>

    <rect x="628" y="538" width="184" height="90" rx="18" fill="#fff" stroke="#d1d5db"/>
    <text x="720" y="566" text-anchor="middle" class="card-title">召回排序</text>
    <text x="720" y="596" text-anchor="middle" class="small">只按偏好分取 TOP3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="680" width="430" height="172" rx="24" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="563" y="710" text-anchor="middle" class="card-title">偏好召回结果：TOP3 候选 Agent</text>
    <rect x="382" y="740" width="350" height="28" rx="14" fill="#2563eb"/>
    <text x="557" y="754" text-anchor="middle" class="label">1. 虎子：0.86 休闲陪伴偏好最高</text>
    <rect x="382" y="778" width="350" height="28" rx="14" fill="#60a5fa"/>
    <text x="557" y="792" text-anchor="middle" class="label">2. 孙悟空：0.68 陪伴娱乐次优</text>
    <rect x="382" y="816" width="350" height="28" rx="14" fill="#93c5fd"/>
    <text x="557" y="830" text-anchor="middle" class="label">3. 豆包：0.51 通用助手兜底</text>
  </g>

  <text x="380" y="900" text-anchor="middle" class="red">当前数据下，用户×场景×类型是最强先验</text>

  <!-- Left arrows -->
  <line x1="153" y1="324" x2="153" y2="374" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M248 426 C276 426, 286 362, 314 362" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M248 600 C276 600, 286 426, 314 426" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M590 382 C616 364, 610 272, 628 272" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="590" y1="426" x2="628" y2="426" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M720 496 L720 538" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M686 628 C650 670, 620 680, 584 680" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Divider arrow to step 2 -->
  <path d="M778 766 C838 766, 852 690, 912 690" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="810" y="720" width="88" height="32" rx="16" fill="#2563eb"/>
  <text x="854" y="736" text-anchor="middle" class="label">TOP3</text>

  <!-- Right side: Step 2 -->
  <text x="1012" y="220" class="code-title">system prompt:</text>
  <g filter="url(#shadow)">
    <rect x="1012" y="244" width="402" height="178" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="1032" y="272" class="code">只输出 JSON: {"agentId":"...","reason":"...","confidence":0.0}</text>
    <text x="1032" y="302" class="code">你只能在候选 TOP3 中选择，不要从全量 Agent 池重选。</text>
    <text x="1032" y="332" class="code">优先参考 preferenceScore；再结合 query 做语义裁决。</text>
    <text x="1032" y="362" class="code">同时解释为什么选择该 Agent，并给出置信度。</text>
    <text x="1032" y="392" class="code">强意图已在外层处理，此处只处理弱意图。</text>
  </g>
  <rect x="1426" y="298" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="322" text-anchor="middle" class="card-title">匹配约束</text>

  <text x="1012" y="466" class="code-title">user prompt:</text>
  <g filter="url(#shadow)">
    <rect x="1012" y="490" width="402" height="188" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="1032" y="518" class="code">{</text>
    <text x="1050" y="546" class="code">"queryText": "我现在需要陪小孩",</text>
    <text x="1050" y="574" class="code">"profile": {"userType":"职场成人","gender":"男"},</text>
    <text x="1050" y="602" class="code">"currentAgentId": "doctor-chen",</text>
    <text x="1050" y="630" class="code">"normalizedScenario": "休闲陪伴",</text>
    <text x="1050" y="658" class="code">"topCandidates": [虎子, 孙悟空, 豆包]</text>
    <text x="1032" y="686" class="code">}</text>
  </g>
  <rect x="1426" y="526" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="550" text-anchor="middle" class="card-title">用户输入 + 画像</text>
  <rect x="1426" y="594" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="610" text-anchor="middle" class="card-title">场景分类结果</text>
  <text x="1535" y="632" text-anchor="middle" class="small">规则 / 小模型</text>

  <rect x="1426" y="650" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="674" text-anchor="middle" class="card-title">TOP3 候选信息</text>

  <text x="1012" y="740" class="code-title">模型输出:</text>
  <g filter="url(#shadow)">
    <rect x="1012" y="764" width="402" height="126" rx="16" fill="#e5e7eb" stroke="#e5e7eb"/>
    <text x="1032" y="792" class="code">{</text>
    <text x="1050" y="820" class="code">"agentId": "little-fox",</text>
    <text x="1050" y="848" class="code">"reason": "query 指向陪小孩，虎子在 TOP3 中最符合儿童陪伴",</text>
    <text x="1050" y="876" class="code">"confidence": 0.92</text>
    <text x="1032" y="904" class="code">}</text>
  </g>
  <rect x="1426" y="804" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="828" text-anchor="middle" class="card-title">最终 agent</text>
  <rect x="1426" y="856" width="218" height="48" fill="#fffbeb" opacity=".9" stroke="#facc15"/>
  <text x="1535" y="880" text-anchor="middle" class="card-title">原因和置信度</text>
</svg>
</body>
</html>
